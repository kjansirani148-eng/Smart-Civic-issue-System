{% extends 'base.html' %}

{% block title %}Profile - Smart Civic{% endblock %}

{% block content %}
<h2>Update Profile</h2>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input class="form-control" type="text" name="name" value="{{ current_user.name }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input class="form-control" type="text" name="phone" value="{{ current_user.phone or '' }}" />
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" name="address" rows="3">{{ current_user.address or '' }}</textarea>
      </div>
      <button class="btn btn-primary">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
